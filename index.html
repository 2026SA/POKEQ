<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff7d6" />
  <title>POKEQ | ポケキュー！</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-main">POKEQ</div>
        <div class="brand-ja">ポケキュー！</div>
        <p class="subtitle">9ひきを そろえて クリアしよう！</p>
      </div>
      <div class="timer-card" aria-label="経過時間">
        <span>TIME</span>
        <strong id="timer">00:00</strong>
      </div>
    </header>

    <section class="toolbar" aria-label="ゲーム設定">
      <label class="control-box">
        <span>むずかしさ</span>
        <select id="difficulty">
          <option value="easy">かんたん</option>
          <option value="normal" selected>ふつう</option>
          <option value="hard">むずかしい</option>
        </select>
      </label>

      <label class="control-box toggle-control">
        <span>数字を表示</span>
        <input id="showNumbers" type="checkbox" checked />
        <span class="switch-ui" aria-hidden="true"><span class="switch-knob"></span></span>
      </label>

      <label class="control-box toggle-control hint-control">
        <span>ミスをおしえる</span>
        <input id="instantHints" type="checkbox" />
        <span class="switch-ui" aria-hidden="true"><span class="switch-knob"></span></span>
      </label>

      <a class="btn btn-help" href="howto.html">？ あそびかた</a>
      <button id="newGameBtn" class="btn btn-soft" type="button">新しい問題</button>
    </section>

    <p class="hint-note">「ミスをおしえる」は はじめはOFF。じぶんで考えたいときは、そのままがおすすめです。</p>

    <section class="game-area">
      <div class="board-wrap">
        <div id="sudokuBoard" class="sudoku-board" role="grid" aria-label="数独盤面"></div>
      </div>

      <aside class="side-panel">
        <h2>ポケモンをえらぼう</h2>
        <p class="choose-guide"><strong>① マスをタップ</strong> → <strong>② ポケモンをタップ</strong></p>
        <div id="palette" class="pokemon-palette" aria-label="ポケモン選択"></div>

        <div class="action-grid">
          <button id="eraseBtn" class="btn btn-soft" type="button">けす</button>
          <button id="checkBtn" class="btn btn-primary" type="button">チェック</button>
          <button id="resetBtn" class="btn btn-soft" type="button">やりなおす</button>
        </div>

        <p id="statusMessage" class="status-message" aria-live="polite">
          まず、ポケモンを入れたいマスをタップしてね。
        </p>
      </aside>
    </section>

    <footer class="app-footer">
      非公式のファン制作・教育用ゲームです。Pokémon関連各社とは関係ありません。
    </footer>
  </main>

  <div id="celebration" class="celebration" hidden>
    <div class="celebration-card" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <div class="sparkles" aria-hidden="true">✦ ✨ ★ ✦</div>
      <p class="clear-kicker">CONGRATULATIONS!</p>
      <h2 id="clearTitle">クリア！ おめでとう！</h2>
      <p class="clear-message">9ひきのみんなが そろったよ！</p>
      <div id="celebrationPokemon" class="celebration-pokemon"></div>
      <p class="clear-time">クリアタイム：<strong id="clearTime">00:00</strong></p>
      <div class="clear-actions">
        <button id="closeClearBtn" class="btn btn-soft btn-large" type="button">盤面を見る</button>
        <button id="playAgainBtn" class="btn btn-primary btn-large" type="button">新しい問題にちょうせん</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
